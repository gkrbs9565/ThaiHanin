<!DOCTYPE html>
<html lang="ko">
  <head>
    <!--
      재태국한인회 전체 메뉴 페이지 (모바일 기준)
      - 로그인 여부에 따라 "로그인" / "회원 이름" 영역과 메뉴 구성이 달라진다.
      - 실제 로그인 상태 전환은 body 태그의 class (is-guest / is-member)를 기준으로 한다.
    -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>전체 메뉴</title>
    <link rel="stylesheet" href="css/menu.css" />
  </head>
  <!--
    [로그인 상태 전환 방법 요약]
    - 비로그인 화면: <body class="menu-page is-guest">
      · 상단 타이틀: "로그인 >"
      · My page 카드: "회원가입 / 로그인" 메뉴만 표시
    - 로그인 화면:   <body class="menu-page is-member">
      · 상단 타이틀: "회원 이름 님 >" (menu.js에서 이름 주입)
      · My page 카드: "My page / 회비납부내역 / 강의실예약" + 하단 "로그아웃" 버튼 표시

    ※ 실제 서비스에서는 서버/스크립트에서 로그인 상태를 확인한 뒤,
       is-guest / is-member 클래스를 토글하거나, menu.js에서 URL 파라미터로 전달된 이름을 읽어 처리한다.
  -->
  <body class="menu-page is-guest">
    <div class="menu-root">
      <!--
        [페이지 기본 레이아웃]
        - 상단: "전체 메뉴" + 홈 / 닫기 아이콘 (고정)
        - 중간: "로그인 >" 또는 "회원 이름 님 >" 타이틀
        - 하단: My page 카드 영역 (로그인 상태에 따라 노출 메뉴 변경)
      -->
      <!--
        상단 헤더 영역
        - 왼쪽: "전체 메뉴" 텍스트
        - 오른쪽: 홈 아이콘 / 닫기 아이콘
        - 실제 구현 시, 각 버튼에 location.href 또는 history.back() 등 네비게이션 로직을 연결해 사용한다.
      -->
      <header class="menu-header">
        <div class="menu-header__left">
          <span class="menu-header__title">전체 메뉴</span>
        </div>
        <div class="menu-header__right">
          <!-- 실제 아이콘으로 교체 가능 -->
          <button class="icon-button" type="button">
            <a href="index.html"><img src="img/house.svg" alt="" /></a>
          </button>
          <button class="icon-button" type="button">
            <img src="img/x.svg" alt="" />
          </button>
        </div>
      </header>

      <!--
        [비로그인용 타이틀]
        - 로그인하지 않은 사용자는 항상 "로그인 >" 문구만 보여준다.
      -->
      <section class="menu-main-title guest-only">
        <h1 class="menu-main-title__text">
          <a class="menu-main-title__label" href="index.html">로그인</a>
          <img src="img/caret-right-mini.svg" alt="" />
        </h1>
        <hr />
      </section>

      <!--
        [로그인 상태용 타이틀]
        - menu.js에서 URL 쿼리(name_kr 또는 name)를 읽어와 #menuUserName에 "OOO 님" 형태로 표시한다.
      -->
      <section class="menu-main-title member-only">
        <h1 class="menu-main-title__text">
          <span class="menu-main-title__label" id="menuUserName">
            회원 이름
          </span>
          <span class="menu-main-title__chevron">›</span>
        </h1>
      </section>

      <!--
        My page 카드 영역
        - 상단 "My page" 라벨
        - 내용:
          · 비로그인: 회원가입 / 로그인 메뉴만 노출 (guest-only)
          · 로그인  : My page / 회비납부내역 / 강의실예약 노출 (member-only)
      -->
      <main class="menu-content">
        <section class="menu-section">
          <h2 class="menu-section__label">My page</h2>

          <!-- 비로그인 상태에서만 보이는 메뉴 카드 -->
          <div class="menu-card guest-only">
            <a href="Agreement.html" class="menu-card__item">회원가입</a>
            <a href="index.html" class="menu-card__item">로그인</a>
          </div>

          <!-- 로그인 상태에서만 보이는 메뉴 카드 -->
          <div class="menu-card member-only">
            <a href="#" class="menu-card__item">My page</a>
            <a href="#" class="menu-card__item">회비납부내역</a>
            <a href="#" class="menu-card__item">강의실예약</a>
          </div>
        </section>

        <!--
          로그인 상태에서만 보이는 로그아웃 버튼
          - CSS에서 .member-only로 제어
          - 실제 구현 시 onclick에 로그아웃 처리(세션 제거, 리다이렉트 등)를 연결한다.
        -->
        <a href="index.html">
          <button type="button" class="menu-logout member-only">
            로그아웃
          </button></a
        >
      </main>
    </div>

    <script src="script/menu.js"></script>
  </body>
</html>
